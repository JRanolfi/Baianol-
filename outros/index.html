<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>É a Bahia.</title>
</head>

<body>
    <div class="countdown">
        <div class="countdown-box">
            <div class="time">
                <span id="days">00</span>
                <p>DIAS</p>
            </div>
            <div class="time">
                <span id="hours">00</span>
                <p>HORAS</p>
            </div>
            <div class="time">
                <span id="minutes">00</span>
                <p>MINUTOS</p>
            </div>
            <div class="time">
                <span id="seconds">00</span>
                <p>SEGUNDOS</p>
            </div>
        </div>
    </div>
</body>

</html>
